
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceScanner Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h2>FaceScanner Attendance</h2>
    <p id="message">กำลังเตรียมกล้อง...</p>

    <div class="camera">
      <video id="v" autoplay playsinline muted></video>
    </div>

    <button id="openCam">เปิดกล้อง</button>
    <button id="stopCam">ปิดกล้อง</button>

    <p id="cameraStatus">รอเปิดกล้อง</p>
  </main>

  <!-- เชื่อมต่อ Google Apps Script Bridge -->
  <iframe
    id="gasBridge"
    src="https://script.google.com/macros/s/AKfycbx10FL1pbuw48xKK3uxdRwipaErk6qXaR1GBaaToDZ2LCJD97FAoxPA0Ge3nAvBE6rdvQ/exec?page=bridge"
    style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0"
    title="Google Apps Script Bridge">
  </iframe>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>

  <script>
    const BRIDGE_CHANNEL = "ATTENDANCE_BRIDGE";
    const bridgeFrame = document.getElementById("gasBridge");

    // ส่งข้อมูลไป Google Apps Script
    function sendScanToBridge(payload) {
      return new Promise((resolve, reject) => {
        const requestId =
          "scan_" + Date.now() + "_" +
          Math.random().toString(36).slice(2);

        const timeout = setTimeout(() => {
          window.removeEventListener("message", handler);
          reject(new Error("Google Apps Script ไม่ตอบกลับ"));
        }, 30000);

        function handler(event) {
          if (event.source !== bridgeFrame.contentWindow) return;

          const msg = event.data;

          if (
            !msg ||
            msg.channel !== BRIDGE_CHANNEL ||
            msg.type !== "SCAN_RESULT" ||
            msg.requestId !== requestId
          ) return;

          clearTimeout(timeout);
          window.removeEventListener("message", handler);

          if (msg.ok) {
            resolve(msg.result);
          } else {
            reject(new Error(msg.error || "บันทึกเวลาไม่สำเร็จ"));
          }
        }

        window.addEventListener("message", handler);

        bridgeFrame.contentWindow.postMessage({
          channel: BRIDGE_CHANNEL,
          action: "scan",
          requestId: requestId,
          payload: payload
        }, "*");
      });
    }
  </script>

  <script src="camera.js"></script>

</body>
</html>
